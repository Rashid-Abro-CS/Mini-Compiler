const $=s=>document.querySelector(s),E_=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

['Parse Tree','The concrete tree of grammar rules that were applied.','It records exactly how the grammar derived the program (chains of single-child rules are collapsed here).'],

const SAMPLES={c:`int a = 2 * 3;
int b = a + 4 * 2;

while (i < b) {

    cout << total << endl;
}`,java:`int x = 10;
int y = x * 2 + 5;

if (big) {
    System.out.println(y);
}`,py:`a = 2 * 3
b = a + 4 * 2

const ERRS={c:'int x = y + 1;\nint x = 2;',cpp:'int n = "hello";',java:'int n = 3.5;',py:'z = q * 2'};

/* ---------- PARSER (recursive descent -> parse tree + AST) ---------- */

/* ---------- TAC ---------- */
function gen(ast,e){const out=[];let tn=0,ln=0;const T=()=>'t'+ ++tn,Lb=()=>'L'+ ++ln,em=(i,loc)=>{i.loc=loc;out.push(i)};

 const st=n=>{switch(n.kind){
  case'Prog':case'Block':n.k.forEach(st);break;
  case'Decl':if(n.k[0])em({op:'=',a:ex(n.k[0]),r:n.id},n.loc);break;
  case'Assign':em({op:'=',a:ex(n.k[0]),r:n.id},n.loc);break;
  case'Print':n.k.forEach(x=>em({op:'param',a:ex(x)},x.loc));em({op:'call',a:'print',b:n.k.length},n.loc);break;
  case'If':{const c=ex(n.k[0]),l1=Lb();em({op:'ifFalse',a:c,r:l1},n.k[0].loc);st(n.k[1]);
   if(n.k[2]){const l2=Lb();em({op:'goto',r:l2},n.loc);em({op:'label',r:l1},n.loc);st(n.k[2]);em({op:'label',r:l2},n.loc)}else em({op:'label',r:l1},n.loc);break}
  case'While':{const s=Lb(),x=Lb();em({op:'label',r:s},n.loc);const c=ex(n.k[0]);em({op:'ifFalse',a:c,r:x},n.k[0].loc);st(n.k[1]);em({op:'goto',r:s},n.loc);em({op:'label',r:x},n.loc)}}};
 st(ast);out.forEach(x=>e(7,'tac',x.loc,/^t\d/.test(x.r||'')?`Emit ${fmt(x)}; ${x.r} is a fresh temporary holding this partial result.`:`Emit ${fmt(x)} for the highlighted source.`,{ins:x},['AST node',fmt(x)]));return out}

 f=(o,a,b)=>{a=+a;b=+b;switch(o){case'+':return a+b;case'-':return a-b;case'*':return a*b;case'/':return b?Number.isInteger(a)&&Number.isInteger(b)?Math.trunc(a/b):a/b:null;case'%':return b?a%b:null;case'<':return+(a<b);case'>':return+(a>b);case'<=':return+(a<=b);case'>=':return+(a>=b);case'==':return+(a==b);case'!=':return+(a!=b);case'&&':return+(a&&b);case'||':return+(a||b)}return null},ctl=['ifFalse','goto','label'];

   if(x.op!='goto'&&x.op!='call')for(const q of['a','b']){if(x[q]!==undefined&&env[x[q]]!==undefined){const o=fmt(x),old=x[q];x[q]=env[old];ch=1;rec('Constant propagation',`${old} is known to be ${x[q]}: ${o} → ${fmt(x)}`,x)}}
   const un=x.op[0]=='u';if(x.op!='='&&!ctl.includes(x.op)&&x.op!='param'&&x.op!='call'&&isC(x.a)&&(un||isC(x.b))){const o=fmt(x),v=un?(x.op=='u-'?-x.a:+!+x.a):f(x.op,x.a,x.b);if(v!==null){x.op='=';x.a=String(v);delete x.b;ch=1;rec('Constant folding',`${o} → ${fmt(x)}`,x)}}

function compile(src,L){const t0=performance.now(),ev=[],e=(st,t,loc,m,d,io)=>ev.push({st,t,loc,m,d,io})-1,R={ev,src,L,errs:[],warns:[]};

function upd(){const R=S.res,pc=$('#pC');if(!R||!pc)return;const x=R.ev[S.i];$('#chips').innerHTML=chips(S.i);
 $('#pL').innerHTML=srcH(R.src,x.loc,x.st==1?x.loc[1]:null);const sl=pc.scrollLeft,sT=pc.scrollTop;pc.innerHTML=center(x,S.i);pc.scrollLeft=sl;pc.scrollTop=sT;
 $('#pR').innerHTML=right(x);$('#sl').max=R.ev.length-1;$('#sl').value=S.i;$('#pp').textContent=S.play?'⏸':'▶';$('#cnt').textContent=`${S.i+1} / ${R.ev.length}`}
const up=(i,st)=>S.res.ev.slice(0,i+1).filter(x=>x.st==st);
function tree(r,i){const W=96,H=58;let ns='',es='';(function w(n,par){if(n.e>i)return;
  if(par)es+=`<line x1="${par.x*W+W/2}" y1="${par.y*H+32}" x2="${n.x*W+W/2}" y2="${n.y*H+4}"/>`;
  ns+=`<g><title>${E_(n.l)}</title><rect class="${n.e==i?'cur':n.leaf?'lf':''}" x="${n.x*W+4}" y="${n.y*H+4}" width="${W-8}" height="28" rx="8"/><text x="${n.x*W+W/2}" y="${n.y*H+22}" text-anchor="middle">${E_(n.l.length>13?n.l.slice(0,12)+'…':n.l)}</text></g>`;(n.k||[]).forEach(k=>w(k,n))})(r,null);
 return`<svg width="${(r.mx+1)*W}" height="${(r.my+1)*H+10}">${es}${ns}</svg>`}
const symT=(i)=>{const m=new Map();S.res.ev.slice(0,i+1).forEach(x=>{if(x.st==6&&(x.t=='insert'||x.t=='update'))m.set(x.d.scope+'.'+x.d.name,x.d)});return[...m.values()]};
function symH(i,x){const rows=symT(i),nm=x&&x.st==6?x.d.name||x.d.miss:null,t=x&&x.st==6?x.t:'';
 return`<table><tr><th>Identifier</th><th>Type</th><th>Scope</th><th>Value</th><th>Bytes@offset</th><th>Declared at</th></tr>${rows.map(d=>`<tr class="${d.name==nm?(t=='insert'?'new':t=='update'?'upd':'look'):''}"><td class=mono>${E_(d.name)}</td><td>${d.ty}</td><td>${d.scope}</td><td class=mono>${E_(d.val)}</td><td>${d.bytes}@${d.off}</td><td>line ${S.res.src.slice(0,d.loc[0]).split('\n').length}</td></tr>`).join('')||'<tr><td colspan=6 class=mut>No symbols yet.</td></tr>'}</table>${x&&x.t=='lookup'&&x.d.miss?`<p class=bd>Lookup of “${E_(x.d.miss)}” failed: no such symbol.</p>`:''}`}
function tacH(i,x){const l=up(i,7);return l.map(y=>`<div class="ins ${y===x?'cur':''}">${E_(fmt(y.d.ins))}</div>`).join('')||'<p class=mut>No instructions yet.</p>'}
function optH(i){const R=S.res,ev=up(i,8),aft=ev.length?ev[ev.length-1].d.after:R.tac,bs=R.tac.map(fmt),as=aft.map(fmt);
 return`<div class=row style="align-items:flex-start;gap:16px"><div style="flex:1;min-width:200px"><h3>Before (${bs.length})</h3>${R.tac.map(y=>`<div class="ins ${as.includes(fmt(y))?'':'del'}">${E_(fmt(y))}</div>`).join('')}</div><div style="flex:1;min-width:200px"><h3>After (${as.length})</h3>${aft.map(y=>`<div class="ins ${bs.includes(fmt(y))?'':'add'}">${E_(fmt(y))}</div>`).join('')}</div></div><h3 style="margin-top:14px">Transformations applied</h3>${ev.filter(y=>y.t=='opt').map(y=>`<div class=mut>• ${E_(y.m)}</div>`).join('')||'<p class=mut>None yet.</p>'}`}
function dash(){const R=S.res;return`<div class="card ${R.failed?'err':'okc'}"><span class="big ${R.failed?'bd':'gd'}">${R.failed?'Compilation failed':'Compilation succeeded'}</span><div class=stats>${Object.entries(R.stats).map(([k,v])=>`<div class=card><div class=big>${v}</div><span class=mut>${k}</span></div>`).join('')}</div></div>
 ${R.errs.map(x=>`<p class=bd>✗ ${E_(x.m)}</p>`).join('')}${R.warns.map(x=>`<p class=warn>⚠ ${E_(x.m)}</p>`).join('')}
 ${R.opt?`<div class=row style="align-items:flex-start;gap:16px"><div style="flex:1"><h3>Generated TAC</h3>${R.tac.map(y=>`<div class=ins>${E_(fmt(y))}</div>`).join('')}</div><div style="flex:1"><h3>Optimized TAC</h3>${R.opt.map(y=>`<div class=ins>${E_(fmt(y))}</div>`).join('')}</div></div>`:''}<div class=row><button class="b pri" onclick="out('${S.name.replace(/\W+/g,'_')}_report.txt',report())">Export report</button></div>`}
function center(x,i){const R=S.res;let h='';
 if(x.t=='err')h+=`<div class="card err"><h3>${STG[x.st][0]} error</h3><p>${E_(x.m)}</p>${x.d.hint?`<p class=mut>${E_(x.d.hint)}</p>`:''}<button class=b onclick="jump(${Math.max(0,x.st-1)})">Return to ${STG[Math.max(0,x.st-1)][0]}</button></div>`;
 switch(x.st){
  case 0:h+=`<div class=card><h3>${LANG[R.L]} source loaded</h3><p class=mut>${E_(x.m)}</p></div>`;break;
  case 1:{const tk=up(i,1).filter(y=>y.t=='token'),sc=x.t=='scan';h+=`<p>${sc?`Scanning: <span class="tk">${E_(x.d.buf)}</span>`:'Last scan complete.'}</p><h3>Token stream (${tk.length})</h3>${tk.map(y=>`<span class="tk ${y.d.tk.c}" title="${y.d.tk.c}">${E_(y.d.tk.x)}</span>`).join('')}<p class=mut>${['keyword','identifier','number','string','operator','punct'].map(c=>c+': '+tk.filter(y=>y.d.tk.c==c).length).join(' · ')}</p>`;break}
  case 2:h+=`<h3>Grammar rules applied</h3>`+up(i,2).slice(-14).map(y=>`<div class="ins ${y===x?'cur':''}">${E_(y.d.rule)}</div>`).join('');break;
  case 3:h+=tree(R.pt,i);break;case 4:h+=tree(R.ast,i);break;
  case 5:h+=up(i,5).filter(y=>y.t!='err').map(y=>`<div class="${y.t=='err_s'?'bd':y.t=='warn'?'warn':''}" style="${y===x?'background:rgba(139,92,246,.25)':''}">${y.t=='err_s'?'✗':y.t=='warn'?'⚠':'✓'} ${E_(y.m)}</div>`).join('');break;
  case 6:h+=symH(i,x);break;case 7:h+=tacH(i,x);break;case 8:h+=optH(i);break;case 9:h+=dash()}
 return h}
function right(x){const s=STG[x.st];return`<h3>${s[0]}</h3><p class=mut>${s[1]}</p><h4>Current operation</h4><p>${E_(x.m)}</p>${x.io?`<h4>Input → output</h4><p class=mono>${E_(x.io[0])}<br>⟶ ${E_(x.io[1])}</p>`:''}${x.d&&x.d.hint?`<h4>How to fix</h4><p>${E_(x.d.hint)}</p>`:''}<h4>Why this step exists</h4><p>${s[2]}</p>${S.note?`<h4>Guided note</h4><p>${E_(S.note)}</p>`:''}`}
function stat(v){const R=S.res;if(!R)return empty();const i=R.ev.length-1,t={sym:['Symbol Table',()=>symH(i,null)],tac:['Three-Address Code',()=>R.tac?tacH(i,null):'<p class=mut>TAC was not generated because compilation stopped earlier.</p>'],opt:['Code Optimization',()=>R.tac?optH(i):'<p class=mut>Nothing to optimise: compilation stopped earlier.</p>'],rep:['Compilation Report',dash]}[v];
 return`<h2>${t[0]}</h2><div class=card>${t[1]()}</div>`}
render();
</script></body></html>
